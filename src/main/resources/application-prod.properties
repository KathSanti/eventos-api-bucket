# =====================================================================
#  Perfil PROD: Docker Compose (GitHub Actions) y servidor EC2.
#  Todos los valores sensibles vienen de variables de entorno del servidor.
#  Activar con:  SPRING_PROFILES_ACTIVE=prod
# =====================================================================

# DB_HOST = "db" (MySQL en contenedor) o el endpoint de RDS (xxxx.rds.amazonaws.com).
# createDatabaseIfNotExist: crea la base eventos_db si no existe (útil en RDS).
spring.datasource.url=jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:eventos_db}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# "update" ajusta tablas sin borrar datos. NUNCA "create-drop" en producción (borra todo).
# En la industria se usa "validate" junto con migraciones (Flyway o Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Dominio real del frontend en producción, por ejemplo https://eventos.midominio.cl
app.cors.allowed-origins=${CORS_ORIGINS}
