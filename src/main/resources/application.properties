# =====================================================================
#  Configuración COMÚN a todos los entornos (dev y prod).
#  Aquí NO van secretos: solo referencias ${VARIABLE} que se leen del entorno.
# =====================================================================
spring.application.name=eventos-api-bucket

# Si no se indica un perfil, se usa "dev".
# En producción (EC2) se define la variable SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# Lee el archivo .env de la raíz del proyecto, si existe (está en .gitignore).
spring.config.import=optional:file:.env[.properties]

# No mantener abierta la conexión a la BD mientras se arma el JSON de respuesta.
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Clave en Base64 de al menos 32 bytes. Generar con:  openssl rand -base64 32
# Sin valor por defecto a propósito: si falta, la aplicación NO arranca (fail fast).
jwt.secret=${JWT_SECRET}
# 3600000 ms = 1 hora
jwt.expiration-ms=3600000
jwt.issuer=eventos-api
jwt.audience=eventos-frontend

# ---------- Administrador inicial ----------
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}
# IPs desde las que el ADMIN puede iniciar sesión y usar su token (IP o CIDR, separadas por coma).
# Vacío = sin restricción. Ejemplo: ADMIN_ALLOWED_IPS=190.20.30.40/32
app.admin.ips-permitidas=${ADMIN_ALLOWED_IPS:}

# ---------- AWS S3 ----------
# Región del bucket (AWS Academy usa us-east-1).
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
# Nombre del bucket: lo decide el servidor, nunca el cliente.
app.s3.bucket=${S3_BUCKET}
# Credenciales de AWS Academy (Learner Lab -> AWS Details -> AWS CLI). Cambian en cada sesión.
# Las lee config/StorageConfig. Si quedan vacías, se usa la cadena por defecto del SDK (IAM Role).
app.aws.access-key=${AWS_ACCESS_KEY_ID:}
app.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.aws.session-token=${AWS_SESSION_TOKEN:}

# Tamaño máximo de archivos subidos (para reemplazar un resumen).
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# ---------- Errores ----------
# No exponer detalles internos (stacktrace, mensajes de excepción) al cliente.
server.error.include-stacktrace=never
server.error.include-message=never
