# =====================================================================
#  Perfil DEV: tu computador.
# =====================================================================

# Base de datos H2 en memoria: se crea al arrancar y se borra al apagar.
spring.datasource.url=jdbc:h2:mem:eventosdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas a partir de las entidades (solo aceptable en desarrollo).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Frontend local permitido por CORS (Vite usa 5173, React/Angular 3000/4200).
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4200

# Más detalle en el log sobre por qué se rechaza un JWT (solo en dev).
logging.level.com.duoc.eventos_api_bucket.security=DEBUG
