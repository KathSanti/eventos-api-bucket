# =====================================================================
#  CI/CD - Eventos API
#
#  Job 1 (test)              -> compila y ejecuta los tests.
#  Job 2 (levantar-backend)  -> levanta backend + MySQL con Docker Compose,
#                               verifica que responde y publica la imagen en Docker Hub.
#  Job 3 (desplegar-ec2)     -> despliega la imagen publicada en la instancia EC2.
#
#  En un Pull Request solo corre el job 1. Los jobs 2 y 3 corren con push a main
#  o al ejecutarlo a mano (Actions -> CI/CD - Eventos API -> Run workflow).
#
#  Lo que este workflow espera encontrar en el repositorio:
#    - pom.xml en la raíz del repositorio
#    - Dockerfile multi-etapa en la raíz (compila el .jar dentro de la imagen)
#    - docker-compose.yml en la raíz, con los servicios "app" (puerto 8080) y "db"
#    - deploy/compose.ec2.yml para el servidor (usa "image:" en vez de "build:", puerto 80)
#
#  Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#    AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN  (Learner Lab, cambian en cada sesión)
#    DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#    EC2_HOST, EC2_USER, EC2_SSH_KEY
#    JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD, DB_PASSWORD           (producción)
#  Variables (pestaña Variables):
#    AWS_REGION, S3_BUCKET, DOCKER_IMAGE_NAME, CORS_ORIGINS (opcional)
#    DB_MODE (opcional): "contenedor" (por defecto, MySQL en la EC2) o "rds"
#    ADMIN_ALLOWED_IPS (opcional): IPs desde las que el admin puede entrar, ej. 190.20.30.40/32
#  Solo si DB_MODE = rds (Secrets): DB_HOST (endpoint de RDS) y DB_USER (usuario maestro)
# =====================================================================
name: CI/CD - Eventos API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Evita dos despliegues al mismo tiempo sobre la misma EC2.
concurrency:
  group: eventos-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # JOB 1: TESTS
  # No necesita secretos: los tests usan el perfil "test"
  # (src/test/resources/application-test.properties).
  # ------------------------------------------------------------------
  test:
    name: 1) Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar tests
        run: mvn -B -ntp clean verify

      - name: Guardar reportes de tests (para revisarlos si algo falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-tests
          path: target/surefire-reports/
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # JOB 2: LEVANTAR EL BACKEND
  # Construye la imagen, levanta app + MySQL con Docker Compose, comprueba
  # que la API responde y que la seguridad JWT funciona. Si todo pasa,
  # publica la imagen en Docker Hub para que el job 3 la despliegue.
  # ------------------------------------------------------------------
  levantar-backend:
    name: 2) Levantar backend y publicar imagen
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # No hace falta instalar Java: el Dockerfile multi-etapa compila el .jar dentro de la imagen.
      - name: Verificar credenciales de AWS Academy y acceso al bucket
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" && test -n "$AWS_SESSION_TOKEN" \
            || { echo "::error::Faltan credenciales AWS. Actualízalas en Secrets: cambian en cada sesión del Learner Lab."; exit 1; }
          test -n "$S3_BUCKET" || { echo "::error::Falta la variable S3_BUCKET."; exit 1; }
          aws sts get-caller-identity --query Arn --output text
          aws s3api head-bucket --bucket "$S3_BUCKET"

      # .env temporal solo para esta ejecución. JWT y contraseñas se generan al azar:
      # este entorno se destruye al terminar el job, así que no hace falta guardarlos.
      - name: Crear .env temporal para Docker Compose
        run: |
          umask 077
          {
            echo "JWT_SECRET=$(openssl rand -base64 32)"
            echo "ADMIN_EMAIL=admin@ci.local"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "CORS_ORIGINS=http://localhost:5173"
            echo "AWS_REGION=$AWS_REGION"
            echo "S3_BUCKET=$S3_BUCKET"
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN"
          } > .env

      - name: Construir y levantar contenedores
        run: docker compose up -d --build

      - name: Comprobar que el backend responde
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/eventos > /dev/null; then
              echo "Backend arriba (intento $i)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::El backend no respondió a tiempo"
          docker compose ps
          docker compose logs --tail=100 app
          exit 1

      - name: Prueba de humo de seguridad (sin token debe responder 401)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/clientes/me)
          echo "GET /api/clientes/me sin token -> $code"
          test "$code" = "401"

      - name: Detener contenedores y borrar el .env temporal
        if: always()
        run: |
          docker compose down -v || true
          rm -f .env

      - name: Preparar emulación ARM64
        uses: docker/setup-qemu-action@v3

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar imagen del backend (AMD64 y ARM64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}-backend:${{ github.sha }}

  # ------------------------------------------------------------------
  # JOB 3: DESPLEGAR EN LA NUBE (EC2)
  # Copia el compose del servidor, escribe el .env en la EC2 (con permisos 600),
  # descarga la imagen publicada en el job 2 y la levanta.
  # ------------------------------------------------------------------
  desplegar-ec2:
    name: 3) Desplegar en AWS EC2 (BD ${{ vars.DB_MODE || 'contenedor' }})
    needs: levantar-backend
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_MODE: ${{ vars.DB_MODE || 'contenedor' }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Verificar sesión de AWS Academy y bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws sts get-caller-identity --query Arn --output text
          aws s3api head-bucket --bucket "$S3_BUCKET"

      - name: Verificar secretos de producción
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
        run: |
          case "$DB_MODE" in
            contenedor) requeridos="JWT_SECRET ADMIN_EMAIL ADMIN_PASSWORD DB_PASSWORD EC2_HOST" ;;
            rds)        requeridos="JWT_SECRET ADMIN_EMAIL ADMIN_PASSWORD DB_PASSWORD EC2_HOST DB_HOST DB_USER" ;;
            *) echo "::error::DB_MODE debe ser 'contenedor' o 'rds' (es '$DB_MODE')"; exit 1 ;;
          esac
          for v in $requeridos; do
            test -n "${!v}" || { echo "::error::Falta el secret $v (modo $DB_MODE)"; exit 1; }
          done
          echo "Modo de base de datos: $DB_MODE"

      - name: Copiar compose de despliegue a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/compose.ec2.yml,deploy/compose.ec2-rds.yml
          target: ~/eventos-api
          strip_components: 1

      - name: Desplegar en la EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          ADMIN_ALLOWED_IPS: ${{ vars.ADMIN_ALLOWED_IPS }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'http://localhost:5173' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_MODE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,DOCKER_IMAGE_NAME,IMAGE_TAG,JWT_SECRET,ADMIN_EMAIL,ADMIN_PASSWORD,DB_PASSWORD,DB_HOST,DB_USER,ADMIN_ALLOWED_IPS,CORS_ORIGINS,AWS_REGION,S3_BUCKET,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN
          command_timeout: 15m
          script: |
            set -eu
            umask 077
            cd ~/eventos-api

            # Elegir el compose según dónde está la base de datos.
            if [ "$DB_MODE" = "rds" ]; then
              COMPOSE_FILE=compose.ec2-rds.yml
            else
              COMPOSE_FILE=compose.ec2.yml
            fi
            echo "Desplegando con $COMPOSE_FILE"

            # Las credenciales viven solo en la EC2, en un archivo con permisos 600:
            # nunca dentro del repositorio ni dentro de la imagen Docker.
            printf '%s=%s\n' \
              DOCKERHUB_USERNAME "$DOCKERHUB_USERNAME" \
              DOCKER_IMAGE_NAME "$DOCKER_IMAGE_NAME" \
              IMAGE_TAG "$IMAGE_TAG" \
              JWT_SECRET "$JWT_SECRET" \
              ADMIN_EMAIL "$ADMIN_EMAIL" \
              ADMIN_PASSWORD "$ADMIN_PASSWORD" \
              DB_PASSWORD "$DB_PASSWORD" \
              DB_HOST "$DB_HOST" \
              DB_USER "$DB_USER" \
              ADMIN_ALLOWED_IPS "$ADMIN_ALLOWED_IPS" \
              CORS_ORIGINS "$CORS_ORIGINS" \
              AWS_REGION "$AWS_REGION" \
              S3_BUCKET "$S3_BUCKET" \
              AWS_ACCESS_KEY_ID "$AWS_ACCESS_KEY_ID" \
              AWS_SECRET_ACCESS_KEY "$AWS_SECRET_ACCESS_KEY" \
              AWS_SESSION_TOKEN "$AWS_SESSION_TOKEN" > .env.tmp
            chmod 600 .env.tmp
            mv .env.tmp .env

            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin > /dev/null
            docker compose -f "$COMPOSE_FILE" --env-file .env pull
            docker compose -f "$COMPOSE_FILE" --env-file .env up -d --remove-orphans

            # En la EC2 la app queda publicada en el puerto 80 (ver deploy/compose.ec2.yml).
            for i in $(seq 1 36); do
              if curl -fsS http://localhost/api/eventos > /dev/null; then
                echo "Backend desplegado y respondiendo (intento $i)"
                docker image prune -f > /dev/null || true
                exit 0
              fi
              sleep 5
            done

            echo "El backend no respondió a tiempo"
            docker compose -f "$COMPOSE_FILE" --env-file .env ps
            docker compose -f "$COMPOSE_FILE" --env-file .env logs --tail=80 app
            exit 1
